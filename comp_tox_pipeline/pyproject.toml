[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp-tox-pipeline"
version = "0.1.0"
description = "Reproducible computational toxicology pipeline (NAMs-oriented)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "matplotlib",
    "joblib",
    "rdkit>=2024.3",
    "torch",
    "torch_geometric",
    "tensorflow>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "snakemake>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (e.g. multi-process DDP spawn)",
]
